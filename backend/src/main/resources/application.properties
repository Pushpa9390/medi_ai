# Spring Boot Server Config
server.port=8080

# Gemini API Integration
# Replace with your real Gemini API key or set as environment variable GEMINI_API_KEY
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent

# File upload limit configs
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
